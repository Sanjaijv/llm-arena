name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static checks
        run: pnpm check
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/llm_arena

      - name: Build application
        run: pnpm build
        env:
          ARCJET_KEY: ajkey_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          DATABASE_URL: postgresql://ci:ci@localhost:5432/llm_arena
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_placeholder
          OPENROUTER_API_KEY: sk-or-v1-ci-placeholder
